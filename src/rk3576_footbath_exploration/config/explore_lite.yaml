/**:
  ros__parameters:
    # Explore_lite reads the live SLAM occupancy grid. The low lidar belongs in
    # Nav2 costmaps, not in slam_toolbox's scan matcher during phase one.
    robot_base_frame: base_footprint
    costmap_topic: /map
    costmap_updates_topic: /map_updates
    return_to_init: false
    start_paused: true
    visualize: true
    require_health_lease: true
    planner_frequency: 0.20
    # Allow Nav2's 30s progress checker to act before bounded frontier retries.
    progress_timeout: 45.0
    # 0.65 m prevents choosing an adjacent point on the same glass wall.
    blacklist_radius: 0.65
    potential_scale: 3.0
    orientation_scale: 0.0
    gain_scale: 1.0
    transform_tolerance: 0.5
    min_frontier_size: 0.50
