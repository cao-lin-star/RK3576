# Apply this file only after public-key login has been tested in a second terminal.
# install_remote_debug.sh installs it only when --harden is explicitly supplied.
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
X11Forwarding no
AllowTcpForwarding local
ClientAliveInterval 30
ClientAliveCountMax 3
MaxAuthTries 3
