auto_cmd_vel_limiter:
  ros__parameters:
    input_topic: /cmd_vel
    output_topic: /cmd_vel_auto_limited
    lease_topic: /safety/auto_motion_lease
    require_lease: true
    max_linear_mps: 0.20
    max_angular_rps: 0.80
    command_timeout_s: 0.30
    lease_timeout_s: 0.50

footbath_command_mux:
  ros__parameters:
    topics:
      manual: /cmd_vel_manual
      auto: /cmd_vel_auto_limited
      output: /cmd_vel_selected
    manual_timeout_s: 0.30
    auto_timeout_s: 0.30
    manual_max_linear_mps: 1.00
    manual_max_angular_rps: 1.50
    auto_max_linear_mps: 0.20
    auto_max_angular_rps: 0.80
    publish_period_s: 0.05
