auto_cmd_vel_limiter:
  ros__parameters:
    input_topic: /cmd_vel
    output_topic: /cmd_vel_auto_limited
    lease_topic: /safety/auto_motion_lease
    require_lease: true
    max_linear_mps: 0.20
    max_angular_rps: 0.80
    command_timeout_s: 0.30
    lease_timeout_s: 0.50

footbath_command_mux:
  ros__parameters:
    topics:
      manual: /cmd_vel_manual
      auto: /cmd_vel_auto_limited
      output: /cmd_vel_selected
    manual_timeout_s: 0.30
    auto_timeout_s: 0.30
    manual_max_linear_mps: 1.00
    manual_max_angular_rps: 1.50
    auto_max_linear_mps: 0.20
    auto_max_angular_rps: 0.80
    publish_period_s: 0.05

glass_suspect_monitor:
  ros__parameters:
    topics:
      high_scan: /scan_high
      low_scan: /scan_low_front
      ultrasonic: /range/ultrasonic
      output: /safety/suspected_glass
      valid: /safety/suspected_glass_valid
    front_half_angle_rad: 0.261799388
    ultrasonic_trigger_max_m: 1.50
    lidar_correspondence_margin_m: 0.15
    sensor_freshness_timeout_s: 0.50
    assert_consecutive_samples: 3
    clear_consecutive_samples: 3
